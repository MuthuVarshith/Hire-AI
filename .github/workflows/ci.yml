# Lint, tests (SQLite and PostgreSQL + pgvector), and a Docker build without push.
# No secrets: tests never call live LLMs (tests/conftest.py fences them off).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: hireai
          POSTGRES_PASSWORD: hireai
          POSTGRES_DB: hireai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hireai -d hireai_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-dev.txt
      - name: Cache the Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-${{ hashFiles('config.py') }}
      - name: Pre-download the embedding model
        env:
          HF_HUB_OFFLINE: "0"
        run: python -c "import scorer; assert scorer.load_embedding_model() is not None"
      - name: Check the model loads offline (otherwise model tests would silently skip)
        env:
          HF_HUB_OFFLINE: "1"
        run: python -c "import scorer; assert scorer.load_embedding_model() is not None"
      - name: Set PostgreSQL URLs
        if: matrix.database == 'postgres'
        run: |
          echo "TEST_DATABASE_URL=postgresql+psycopg://hireai:hireai@127.0.0.1:5432/hireai_test" >> "$GITHUB_ENV"
          echo "TEST_POSTGRES_URL=postgresql+psycopg://hireai:hireai@127.0.0.1:5432/postgres" >> "$GITHUB_ENV"
      - name: Tests
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hireai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
