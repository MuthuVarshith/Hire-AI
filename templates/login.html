<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="same-origin">
    <title>Sign in · HireAI</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <script defer src="/static/js/login.js"></script>
</head>
<body>
    <main class="login-page">
        <form class="login-card" id="login-form" novalidate>
            <div class="logo">🤖 HireAI</div>
            <p class="lead">Sign in to the recruiter dashboard.</p>

            <div id="login-error" class="alert alert-error hidden" role="alert"></div>

            <div class="form-group">
                <label for="login-username">Username</label>
                <input type="text" id="login-username" name="username" autocomplete="username"
                       autocapitalize="none" spellcheck="false" maxlength="255" required autofocus>
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="password" autocomplete="current-password"
                       maxlength="1024" required>
            </div>
            <button type="submit" class="btn btn-primary" id="login-submit">Sign in</button>
        </form>
    </main>
</body>
</html>
